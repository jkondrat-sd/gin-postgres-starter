# Why: docker compose provides local dependencies so developers can run the API without installing PostgreSQL manually.
# What to do: add more local services here, such as Redis or mail testing, when the app grows.
services:
  postgres:
    image: postgres:16-alpine
    container_name: example-gin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example_gin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example_gin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
